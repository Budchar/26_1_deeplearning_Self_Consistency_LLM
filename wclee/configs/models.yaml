  exaone:
    name: "EXAONE-3.5-7.8B"
    path: "/data/AskFake/llm/EXAONE-3.5-7.8B"
    trust_remote_code: true
    dtype: "bfloat16"
    device_map: "auto"
    max_new_tokens: 256
    chat_template: "exaone"
    param_billions: 7.8
    family: "exaone"

  llama:
    name: "Llama-3.1-8B-Instruct"
