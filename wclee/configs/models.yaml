  phi3_mini:
    name: "Phi-3-mini-4k-instruct"
    path: "microsoft/Phi-3-mini-4k-instruct"
    trust_remote_code: false
    dtype: "bfloat16"
    device_map: "auto"
    max_new_tokens: 256
    chat_template: "llama3"    # apply_chat_template (Phi-3 supports standard format)
    param_billions: 3.8
    family: "phi"

  # ── Mistral versions & fine-tunes ────────────────────────────
  nous_hermes_dpo:
    name: "Nous-Hermes-2-Mistral-7B-DPO"
    path: "NousResearch/Nous-Hermes-2-Mistral-7B-DPO"
    tokenizer_path: "mistralai/Mistral-7B-v0.1"   # workaround: tiktoken SentencePiece parse error
    trust_remote_code: false
    dtype: "bfloat16"
    device_map: "auto"
    max_new_tokens: 256
    chat_template: "chatml"    # NousHermes uses ChatML format
    param_billions: 7.0
    family: "mistral"          # Mistral-7B base + SFT (OpenHermes) + DPO

  openchat_35:
    name: "OpenChat-3.5"
    path: "openchat/openchat_3.5"
    tokenizer_path: "mistralai/Mistral-7B-v0.1"   # workaround: tiktoken SentencePiece parse error
    trust_remote_code: false
    dtype: "bfloat16"
    device_map: "auto"
    max_new_tokens: 256
    chat_template: "openchat"  # GPT4 Correct User/Assistant format
    param_billions: 7.0
    family: "mistral"          # Mistral-7B base + C-RLFT

  starling_7b:
    name: "Starling-LM-7B-alpha"
    path: "berkeley-nest/Starling-LM-7B-alpha"
    tokenizer_path: "mistralai/Mistral-7B-v0.1"   # workaround: tiktoken SentencePiece parse error
    trust_remote_code: false
    dtype: "bfloat16"
    device_map: "auto"
    max_new_tokens: 256
    chat_template: "openchat"  # Same OpenChat format, RLHF on top
    param_billions: 7.0
    family: "mistral"          # Mistral-7B base + C-RLFT + RLHF (Nectar reward model)

  zephyr_7b:
    name: "Zephyr-7B-beta"
    path: "HuggingFaceH4/zephyr-7b-beta"
    trust_remote_code: false
    dtype: "bfloat16"
    device_map: "auto"
    max_new_tokens: 256
    chat_template: "llama3"    # apply_chat_template
    param_billions: 7.0
    family: "mistral"          # Mistral-7B base + SFT + DPO

  openhermes:
    name: "OpenHermes-2.5-Mistral-7B"
    path: "teknium/OpenHermes-2.5-Mistral-7B"
    tokenizer_path: "mistralai/Mistral-7B-v0.1"   # same vocab; workaround for tiktoken load error
    trust_remote_code: false
    dtype: "bfloat16"
    device_map: "auto"
    max_new_tokens: 256
    chat_template: "chatml"    # OpenHermes uses ChatML; hardcoded since base tokenizer has no template
    param_billions: 7.0
    family: "mistral"          # Mistral-7B base + SFT (OpenHermes data)

  mistral_base:
    name: "Mistral-7B-v0.1"
    path: "mistralai/Mistral-7B-v0.1"
    trust_remote_code: false
    dtype: "bfloat16"
    device_map: "auto"
    max_new_tokens: 256
