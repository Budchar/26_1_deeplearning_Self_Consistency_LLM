  llama_1b:
    name: "Llama-3.2-1B-Instruct"
    path: "meta-llama/Llama-3.2-1B-Instruct"
    trust_remote_code: false
    dtype: "bfloat16"
    device_map: "auto"
    max_new_tokens: 256
    chat_template: "llama3"
    param_billions: 1.0
    family: "llama"

